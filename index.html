<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faveo AI Search Engine</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img loading="lazy" src="https://www.faveohelpdesk.com/wp-content/uploads/2024/12/Faveo-Helpdesk-Logo.png" width="143" height="90" alt="Faveo Helpdesk Software" class="logo_retina">
            <br>
            <br>
            <h1>Faveo AI Search Engine</h1>
            <p>Building the future of search with AI</p>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search for something..." />
            <button onclick="search()">Search</button>
        </div>

        <!-- Loader (hidden initially) -->
        <div id="loader" class="loader" style="display: none;"></div>

        <div id="results" class="results">
            <!-- Search results will be populated here -->
        </div>

        <div class="footer">
            <p>&copy; 2025 Faveo AI. All rights reserved.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@12.0.4/dist/markdown-it.min.js"></script>
    <script src="./script/script.js"></script>
</body>
</html>
